name: Build, Test, and Publish Artifact

on:
  push:
    branches: [jdbc]
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: mn_playground
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      MICRONAUT_TEST_RESOURCES_ENABLED: "false"
      DATASOURCES_DEFAULT_URL: jdbc:mysql://127.0.0.1:3306/mn_playground
      DATASOURCES_DEFAULT_USERNAME: root
      DATASOURCES_DEFAULT_PASSWORD: password

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Build and test
        run: ./gradlew build shadowJar

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: micronaut-crud-jar
          path: build/libs/micronaut-crud-0.1-all.jar
